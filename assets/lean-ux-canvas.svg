<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#f4f8fa"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#112f43">AI-ToDu · Lean UX Canvas</text><text x="30" y="78" font-family="Arial,sans-serif" font-size="16" fill="#526d80">Hipótesis de producto · revisión TB1 · 30 octubre 2026</text><rect x="30" y="105" width="370" height="205" rx="10" fill="white" stroke="#c4d6df"/><text x="50" y="138" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#087f79">01 · Problema</text><text x="50" y="170" font-family="Arial,sans-serif" font-size="17" fill="#17364a">Registro fragmentado de stock,</text><text x="50" y="194" font-family="Arial,sans-serif" font-size="17" fill="#17364a">venta y entrega. Hipótesis</text><text x="50" y="218" font-family="Arial,sans-serif" font-size="17" fill="#17364a">pendiente de entrevistas</text><text x="50" y="242" font-family="Arial,sans-serif" font-size="17" fill="#17364a">verificables.</text><rect x="420" y="105" width="370" height="205" rx="10" fill="white" stroke="#c4d6df"/><text x="440" y="138" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#087f79">02 · Usuarios</text><text x="440" y="170" font-family="Arial,sans-serif" font-size="17" fill="#17364a">Dueños/administradores y personal</text><text x="440" y="194" font-family="Arial,sans-serif" font-size="17" fill="#17364a">de almacén/logística de pequeños</text><text x="440" y="218" font-family="Arial,sans-serif" font-size="17" fill="#17364a">negocios.</text><rect x="810" y="105" width="370" height="205" rx="10" fill="white" stroke="#c4d6df"/><text x="830" y="138" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#087f79">03 · Resultados de negocio</text><text x="830" y="170" font-family="Arial,sans-serif" font-size="17" fill="#17364a">Menos diferencias y retrabajo.</text><text x="830" y="194" font-family="Arial,sans-serif" font-size="17" fill="#17364a">Objetivos por medir; sin</text><text x="830" y="218" font-family="Arial,sans-serif" font-size="17" fill="#17364a">resultados comerciales afirmados.</text><rect x="30" y="330" width="370" height="205" rx="10" fill="white" stroke="#c4d6df"/><text x="50" y="363" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#087f79">04 · Necesidades</text><text x="50" y="395" font-family="Arial,sans-serif" font-size="17" fill="#17364a">Comprender el saldo, preparar con</text><text x="50" y="419" font-family="Arial,sans-serif" font-size="17" fill="#17364a">referencia única y conocer qué</text><text x="50" y="443" font-family="Arial,sans-serif" font-size="17" fill="#17364a">entrega falta.</text><rect x="420" y="330" width="370" height="205" rx="10" fill="white" stroke="#c4d6df"/><text x="440" y="363" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#087f79">05 · Solución propuesta</text><text x="440" y="395" font-family="Arial,sans-serif" font-size="17" fill="#17364a">Catálogo, movimientos, recepción</text><text x="440" y="419" font-family="Arial,sans-serif" font-size="17" fill="#17364a">parcial, venta y manifiesto con</text><text x="440" y="443" font-family="Arial,sans-serif" font-size="17" fill="#17364a">receptor.</text><rect x="810" y="330" width="370" height="205" rx="10" fill="white" stroke="#c4d6df"/><text x="830" y="363" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#087f79">06 · Hipótesis</text><text x="830" y="395" font-family="Arial,sans-serif" font-size="17" fill="#17364a">La trazabilidad mejora</text><text x="830" y="419" font-family="Arial,sans-serif" font-size="17" fill="#17364a">comprensión. El vínculo venta-</text><text x="830" y="443" font-family="Arial,sans-serif" font-size="17" fill="#17364a">despacho evita duplicar registro.</text><rect x="30" y="555" width="370" height="205" rx="10" fill="white" stroke="#c4d6df"/><text x="50" y="588" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#087f79">07 · Riesgo principal</text><text x="50" y="620" font-family="Arial,sans-serif" font-size="17" fill="#17364a">Suponer procesos, unidades y</text><text x="50" y="644" font-family="Arial,sans-serif" font-size="17" fill="#17364a">prioridades sin observar una</text><text x="50" y="668" font-family="Arial,sans-serif" font-size="17" fill="#17364a">operación real.</text><rect x="420" y="555" width="370" height="205" rx="10" fill="white" stroke="#c4d6df"/><text x="440" y="588" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#087f79">08 · Aprendizaje requerido</text><text x="440" y="620" font-family="Arial,sans-serif" font-size="17" fill="#17364a">Errores, tiempo, ayuda y</text><text x="440" y="644" font-family="Arial,sans-serif" font-size="17" fill="#17364a">comprensión en tareas; 3–5</text><text x="440" y="668" font-family="Arial,sans-serif" font-size="17" fill="#17364a">participantes por segmento/fase.</text><rect x="810" y="555" width="370" height="205" rx="10" fill="white" stroke="#c4d6df"/><text x="830" y="588" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#087f79">09 · Experimento siguiente</text><text x="830" y="620" font-family="Arial,sans-serif" font-size="17" fill="#17364a">Validar recibir 2/4, vender 2 y</text><text x="830" y="644" font-family="Arial,sans-serif" font-size="17" fill="#17364a">confirmar entrega. Registrar</text><text x="830" y="668" font-family="Arial,sans-serif" font-size="17" fill="#17364a">también fallos y desacuerdos.</text></svg>